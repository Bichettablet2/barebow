<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Barebow Tracker</title>
<style>
  :root {
    --purple: #6d4aff;
    --bg: #121218;
    --card: #1e1e28;
    --text: #f2f2f7;
    --muted: #9a9aad;
    --gold: #ffc64d;
    --green: #34c77b;
    --red: #ff5b5b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header {
    background: var(--card); padding: 14px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #2a2a38; position: sticky; top: 0; z-index: 10;
  }
  .header h1 { font-size: 1.1rem; color: var(--purple); }
  .total-score { text-align: right; }
  .total-score .label { font-size: .6rem; color: var(--muted); }
  .total-score .value { font-size: 1.3rem; font-weight: bold; color: var(--gold); }

  .mode-select { display: flex; gap: 8px; padding: 10px; }
  .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; background: var(--card); color: var(--muted); font-weight: 600; cursor: pointer; }
  .mode-btn.active { background: var(--purple); color: #fff; }

  .round-info { display: flex; gap: 10px; padding: 8px 10px; }
  .round-chip { background: var(--card); padding: 6px 12px; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .round-chip.highlight { color: var(--gold); border: 1px solid var(--gold); }

  .target-container {
    display: flex; justify-content: center; padding: 15px; margin: 10px;
    background: radial-gradient(circle, #1a1a24 0%, #121218 70%); border-radius: 16px;
  }
  .target { width: 320px; height: 320px; position: relative; cursor: crosshair; touch-action: manipulation; }

  .stats-row { display: flex; gap: 8px; padding: 10px; }
  .stat-card { flex: 1; background: var(--card); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-card .label { font-size: .6rem; color: var(--muted); text-transform: uppercase; }
  .stat-card .value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
  .stat-card .value.purple { color: var(--purple); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.gold { color: var(--gold); }

  .arrows-display { display: flex; gap: 6px; padding: 0 10px 10px; justify-content: center; flex-wrap: wrap; min-height: 40px; }
  .arrow-pill {
    background: var(--card); border: 1px solid #34344a; border-radius: 16px;
    padding: 6px 14px; font-weight: 700; font-size: .95rem; min-width: 44px; text-align: center;
  }
  .arrow-pill.good { border-color: var(--green); color: var(--green); }
  .arrow-pill.bad { border-color: var(--red); color: var(--red); }

  .btn-row { display: flex; gap: 10px; padding: 10px; }
  .btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid #34344a; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }

  .hint { text-align: center; font-size: .75rem; color: var(--muted); padding: 10px; }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    display: flex; justify-content: space-around; padding: 12px;
    border-top: 1px solid #2a2a38;
  }
  .nav-btn { background: none; border: none; color: var(--muted); font-size: .7rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .nav-btn.active { color: var(--purple); }
  .nav-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }

  .screen { display: none; padding-bottom: 70px; }
  .screen.active { display: block; }

  .history-item { background: var(--card); margin: 10px; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
  .history-item .left .date { font-weight: bold; font-size: .9rem; }
  .history-item .left .details { font-size: .7rem; color: var(--muted); margin-top: 4px; }
  .history-item .score { font-size: 1.2rem; font-weight: bold; color: var(--gold); }

  .new-session-btn { width: 100%; margin: 10px; padding: 14px; background: var(--green); border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }

  .error-banner {
    background: var(--red); color: #fff; padding: 10px; text-align: center; font-size: .85rem; border-radius: 10px; margin: 10px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Barebow Tracker</h1>
  <div class="total-score">
    <div class="label">TOTAL</div>
    <div class="value" id="totalScore">0</div>
  </div>
</div>

<!-- SCREEN: SHOOTING -->
<div id="screen-shoot" class="screen active">

  <div class="mode-select">
    <button class="mode-btn active" data-mode="indoor">🏠 Sala 18m</button>
    <button class="mode-btn" data-mode="outdoor">🌳 Exterior 50m</button>
  </div>

  <div class="round-info">
    <span class="round-chip highlight" id="roundType">Ronda completa</span>
    <span class="round-chip" id="arrowsRemaining">60 / 60</span>
  </div>

  <div class="target-container">
    <svg id="target" class="target" viewBox="0 0 400 400"></svg>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="label">Serie</div>
      <div class="value purple" id="currentEnd">1</div>
    </div>
    <div class="stat-card">
      <div class="label">Flechas</div>
      <div class="value" id="arrowsInEnd">0 / 3</div>
    </div>
    <div class="stat-card">
      <div class="label">Media</div>
      <div class="value green" id="average">-</div>
    </div>
  </div>

  <div class="arrows-display" id="arrowsDisplay">
    <span style="color:var(--muted);align-self:center;font-size:.8rem">Sin flechas registradas</span>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="undoBtn" disabled>↩︎ Flecha</button>
    <button class="btn btn-primary" id="endBtn" disabled>✓ Serie</button>
  </div>

  <p class="hint" id="hintText">Toca la diana para registrar flechas</p>
</div>

<!-- SCREEN: STATS -->
<div id="screen-stats" class="screen">
  <div class="history-item">
    <div class="left">
      <div class="date">Puntuación actual</div>
      <div class="details">Esta sesión</div>
    </div>
    <div class="score" id="sessionTotal">0</div>
  </div>
  <div class="history-item">
    <div class="left">
      <div class="date">Mejor serie</div>
      <div class="details">De esta sesión</div>
    </div>
    <div class="score" id="bestEnd">-</div>
  </div>
  <div class="history-item">
    <div class="left">
      <div class="date">Récord personal</div>
      <div class="details">En esta modalidad</div>
    </div>
    <div class="score" id="personalRecord">-</div>
  </div>
</div>

<!-- SCREEN: HISTORY -->
<div id="screen-history" class="screen">
  <button class="new-session-btn" id="saveSessionBtn">💾 Guardar y cerrar sesión</button>
  <div id="historyList"></div>
</div>

<div class="nav">
  <button class="nav-btn active" data-screen="shoot">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>
    Tiro
  </button>
  <button class="nav-btn" data-screen="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Stats
  </button>
  <button class="nav-btn" data-screen="history">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Histórico
  </button>
</div>

<script>
(function() {
  'use strict';
  
  // ========================================
  // CONFIGURACIÓN
  // ========================================
  const MODES = {
    indoor: { distance: 18, faceCm: 40, arrowsPerEnd: 3, totalArrows: 60 },
    outdoor: { distance: 50, faceCm: 122, arrowsPerEnd: 6, totalArrows: 72 }
  };
  
  // ========================================
  // ESTADO DE LA APP
  // ========================================
  let config = MODES.indoor;
  let currentEnd = 1;
  let arrows = [];
  let completedEnds = [];
  let totalScore = 0;
  let history = [];
  
  // Cargar historial desde localStorage
  try {
    const saved = localStorage.getItem('barebow_history');
    if (saved) history = JSON.parse(saved);
  } catch(e) { history = []; }
  
  // ========================================
  // REFERENCIAS DOM
  // ========================================
  const target = document.getElementById('target');
  const totalScoreEl = document.getElementById('totalScore');
  const currentEndEl = document.getElementById('currentEnd');
  const arrowsInEndEl = document.getElementById('arrowsInEnd');
  const averageEl = document.getElementById('average');
  const arrowsDisplay = document.getElementById('arrowsDisplay');
  const undoBtn = document.getElementById('undoBtn');
  const endBtn = document.getElementById('endBtn');
  const hintText = document.getElementById('hintText');
  const sessionTotalEl = document.getElementById('sessionTotal');
  const bestEndEl = document.getElementById('bestEnd');
  const personalRecordEl = document.getElementById('personalRecord');
  const historyList = document.getElementById('historyList');
  const arrowsRemainingEl = document.getElementById('arrowsRemaining');
  
  // ========================================
  // DIBUJAR Diana
  // ========================================
  function drawTarget() {
    target.innerHTML = '';
    const rings = [
      { color: '#ffffff', r: 40 },
      { color: '#ffffff', r: 36 },
      { color: '#00b7ee', r: 32 },
      { color: '#00b7ee', r: 28 },
      { color: '#1a1a1a', r: 24 },
      { color: '#1a1a1a', r: 20 },
      { color: '#e63946', r: 16 },
      { color: '#e63946', r: 12 },
      { color: '#ffcd00', r: 8 },
      { color: '#ffcd00', r: 4 }
    ];
    
    // Dibujar círculos del exterior al interior
    rings.forEach(ring => {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', 200);
      circle.setAttribute('cy', 200);
      circle.setAttribute('r', ring.r);
      circle.setAttribute('fill', ring.color);
      circle.setAttribute('stroke', '#555');
      circle.setAttribute('stroke-width', '1');
      target.appendChild(circle);
    });
    
    // Marcador X central
    const xCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    xCircle.setAttribute('cx', 200);
    xCircle.setAttribute('cy', 200);
    xCircle.setAttribute('r', 2);
    xCircle.setAttribute('fill', '#ffcd00');
    xCircle.setAttribute('stroke', '#111');
    target.appendChild(xCircle);
    
    // Flechas disparadas en la serie actual
    arrows.forEach((a, i) => {
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      
      const hitCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      hitCircle.setAttribute('cx', a.x);
      hitCircle.setAttribute('cy', a.y);
      hitCircle.setAttribute('r', 6);
      hitCircle.setAttribute('fill', 'rgba(109,74,255,0.4)');
      hitCircle.setAttribute('stroke', '#6d4aff');
      hitCircle.setAttribute('stroke-width', '2');
      group.appendChild(hitCircle);
      
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', a.x);
      text.setAttribute('y', a.y - 8);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', '10');
      text.setAttribute('font-weight', 'bold');
      text.setAttribute('fill', '#fff');
      text.textContent = a.score === 10 ? 'X' : a.score;
      group.appendChild(text);
      
      target.appendChild(group);
    });
  }
  
  // ========================================
  // CALCULAR PUNTUACIÓN
  // ========================================
  function calculateScore(x, y) {
    const dx = x - 200;
    const dy = y - 200;
    const dist = Math.sqrt(dx*dx + dy*dy);
    
    if (dist > 40) return 0;
    
    const ring = Math.ceil(dist / 4);
    const score = 11 - ring;
    const isX = dist <= 4;
    
    return { score, isX };
  }
  
  // ========================================
  // CLICK EN LA DIANA
  // ========================================
  target.addEventListener('click', function(e) {
    const rect = target.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 400;
    const y = ((e.clientY - rect.top) / rect.height) * 400;
    
    const result = calculateScore(x, y);
    if (result.score > 0 && arrows.length < config.arrowsPerEnd) {
      arrows.push({ x, y, ...result });
      updateUI();
    }
  });
  
  // ========================================
  // MODALIDAD
  // ========================================
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const mode = this.dataset.mode;
      if (arrows.length > 0 || completedEnds.length > 0) {
        alert('Guarda la sesión actual antes de cambiar de modalidad.');
        return;
      }
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      config = MODES[mode];
      updateUI();
    });
  });
  
  // ========================================
  // BOTÓN FLECHA (UNDO)
  // ========================================
  undoBtn.addEventListener('click', function() {
    if (arrows.length > 0) {
      arrows.pop();
      updateUI();
    }
  });
  
  // ========================================
  // BOTÓN SERIE
  // ========================================
  endBtn.addEventListener('click', function() {
    if (arrows.length === 0) return;
    
    const endSum = arrows.reduce((sum, a) => sum + a.score, 0);
    completedEnds.push({
      endNumber: currentEnd,
      score: endSum,
      arrows: arrows.slice()
    });
    totalScore += endSum;
    currentEnd++;
    arrows = [];
    updateUI();
  });
  
  // ========================================
  // GUARDAR SESIÓN
  // ========================================
  document.getElementById('saveSessionBtn').addEventListener('click', function() {
    if (totalScore === 0) {
      alert('No hay flechas registradas en esta sesión.');
      return;
    }
    
    const avg = (totalScore / totalArrows()).toFixed(2);
    const recordKey = 'record_' + config.key;
    const currentRecord = localStorage.getItem(recordKey);
    
    let newRecord = false;
    if (!currentRecord || totalScore > parseInt(currentRecord)) {
      newRecord = true;
      localStorage.setItem(recordKey, totalScore);
    }
    
    history.push({
      date: new Date().toLocaleDateString('es-ES'),
      mode: config.key,
      total: totalScore,
      arrows: totalArrows(),
      ends: completedEnds.length,
      avg: avg
    });
    localStorage.setItem('barebow_history', JSON.stringify(history));
    
    // Reset
    arrows = [];
    completedEnds = [];
    totalScore = 0;
    currentEnd = 1;
    
    updateUI();
    alert(newRecord ? 
      '¡NUEVO RÉCORD! Sesión guardada.' : 
      'Sesión guardada en el histórico.');
  });
  
  // ========================================
  // NAVEGACIÓN
  // ========================================
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const screen = this.dataset.screen;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + screen).classList.add('active');
      
      if (screen === 'history') renderHistory();
      if (screen === 'stats') renderStats();
    });
  });
  
  // ========================================
  // ACTUALIZAR INTERFAZ
  // ========================================
  function updateUI() {
    totalScoreEl.textContent = totalScore;
    currentEndEl.textContent = currentEnd;
    arrowsInEndEl.textContent = `${arrows.length} / ${config.arrowsPerEnd}`;
    
    const allArrows = totalArrows();
    const avg = allArrows > 0 ? (totalScore / allArrows).toFixed(2) : '-';
    averageEl.textContent = avg;
    
    const remaining = config.totalArrows - allArrows;
    arrowsRemainingEl.textContent = `${allArrows} / ${config.totalArrows}`;
    
    // Mostrar flechas en la banda
    arrowsDisplay.innerHTML = '';
    if (arrows.length === 0 && completedEnds.length === 0) {
      arrowsDisplay.innerHTML = '<span style="color:var(--muted);align-self:center;font-size:.8rem">Sin flechas registradas</span>';
    } else {
      arrows.forEach((a, i) => {
        const pill = document.createElement('div');
        pill.className = 'arrow-pill';
        if (a.score >= 8) pill.classList.add('good');
        else if (a.score <= 5) pill.classList.add('bad');
        
        const seq = document.createElement('span');
        seq.style.fontSize = '.55rem';
        seq.style.marginRight = '4px';
        seq.style.color = 'var(--muted)';
        seq.textContent = '#' + (allArrows - arrows.length + i + 1);
        
        pill.appendChild(seq);
        pill.appendChild(document.createTextNode(a.score === 10 ? 'X' : String(a.score)));
        arrowsDisplay.appendChild(pill);
      });
    }
    
    // Estado de botones
    undoBtn.disabled = arrows.length === 0;
    endBtn.disabled = arrows.length === 0;
    
    // Texto de ayuda
    if (arrows.length === config.arrowsPerEnd) {
      hintText.textContent = `Serie completa (${config.arrowsPerEnd} flechas). Pulsa ✓ Serie.`;
    } else if (arrows.length === 0 && completedEnds.length === 0) {
      hintText.textContent = 'Toca la diana para registrar flechas. ' + 
        (config.arrowsPerEnd === 3 ? 'Serie de 3 flechas.' : 'Serie de 6 flechas.');
    } else {
      hintText.textContent = `Flecha ${arrows.length + 1} de ${config.arrowsPerEnd}.`;
    }
    
    drawTarget();
    renderStats();
  }
  
  // ========================================
  // TOTAL FLECHAS
  // ========================================
  function totalArrows() {
    return completedEnds.reduce((sum, e) => sum + e.arrows.length, 0) + arrows.length;
  }
  
  // ========================================
  // RENDERIZAR STATS
  // ========================================
  function renderStats() {
    sessionTotalEl.textContent = totalScore;
    
    const best = completedEnds.length > 0 ? 
      Math.max(...completedEnds.map(e => e.score)) : '-';
    bestEndEl.textContent = best;
    
    const recordKey = 'record_' + config.key;
    const record = localStorage.getItem(recordKey);
    personalRecordEl.textContent = record || '-';
  }
  
  // ========================================
  // RENDERIZAR HISTÓRICO
  // ========================================
  function renderHistory() {
    historyList.innerHTML = '';
    
    if (history.length === 0) {
      historyList.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px">Sin sesiones guardadas. Registra flechas y guarda una sesión para verla aquí.</div>';
      return;
    }
    
    history.slice().reverse().forEach(h => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="left">
          <div class="date">${h.date}</div>
          <div class="details">${h.mode === 'indoor' ? '🏠 18m' : '🌳 50m'} · ${h.ends} series · media ${h.avg}</div>
        </div>
        <div class="score">${h.total}</div>
      `;
      historyList.appendChild(item);
    });
  }
  
  // ========================================
  // INICIALIZAR
  // ========================================
  drawTarget();
  updateUI();
  
})();
</script>
</body>
</html>
